version: 2
updates:
  # next·react는 메이저가 오르면 API가 바뀌므로 문서를 읽고 직접 올립니다(AGENTS.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [deps]
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-patch:
        dependency-type: production
        update-types: [patch]
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react*
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [deps, ci]
    commit-message:
      prefix: ci
