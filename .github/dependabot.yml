version: 2
updates:
  # 한 달에 npm 최대 2개(마이너·패치 / 메이저) + Actions 1개로 묶습니다.
  # next·react 메이저는 문서를 읽고 직접 올립니다(AGENTS.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    labels: [deps]
    commit-message:
      prefix: build
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react*
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [deps, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
