name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 기본 GITHUB_TOKEN으로 연 PR에는 GitHub가 다른 워크플로를 돌리지 않아, main 보호의 필수 CI가
      # 영원히 대기합니다. 그래서 index-blog 전용·Contents/PR 쓰기만 가진 fine-grained 토큰을 씁니다.
      # 사이트가 GitHub를 읽는 토큰(GITHUB_TOKEN 환경변수, 읽기 전용)과는 일부러 분리했습니다.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
